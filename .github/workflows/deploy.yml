name: Advanced CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # --------------------------------------------------
  # 1. Terraform validation
  # --------------------------------------------------

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate


  # --------------------------------------------------
  # 2. Terraform security scanning
  # --------------------------------------------------

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Terraform Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: 1


  # --------------------------------------------------
  # 3. Docker build and vulnerability scanning
  # --------------------------------------------------

  docker:
    name: Docker Build and Scan
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: docker
        run: docker build -t launch2live-ai:ci .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: launch2live-ai:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1


  # --------------------------------------------------
  # 4. Terraform plan
  # --------------------------------------------------

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - terraform
      - terraform-security

    env:
      TF_ENVIRONMENT: dev

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::680135733197:role/GitHubActions-Terraform-Plan
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=eu-west-2" \
            -var="project_name=ai-saas" \
            -var="environment=${TF_ENVIRONMENT}" \
            -var="vpc_cidr=10.0.0.0/16" \
            -var='availability_zones=["eu-west-2a","eu-west-2b","eu-west-2c"]' \
            -var='public_subnets=["10.0.101.0/24","10.0.102.0/24","10.0.103.0/24"]' \
            -var='private_subnets=["10.0.1.0/24","10.0.2.0/24","10.0.3.0/24"]' \
            -var="admin_cidr=10.255.255.255/32" \
            -var="key_name=ci-placeholder-key" \
            -var="instance_type=t3.micro"
            